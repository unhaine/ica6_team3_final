services:
  # Local-only PostgreSQL (for running Next.js via `npm run dev` on host)
  db:
    image: postgres:16-alpine
    container_name: refrigerai-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-refrigerai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-refrigerai123!}
      POSTGRES_DB: ${POSTGRES_DB:-refrigerai}
    ports:
      # Host 5433 -> Container 5432 (avoid conflict with local PostgreSQL on 5432)
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-refrigerai} -d ${POSTGRES_DB:-refrigerai}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

