services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: refrigerai-db
    restart: always
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-refrigerai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-refrigerai123!}
      POSTGRES_DB: ${POSTGRES_DB:-refrigerai}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-refrigerai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: refrigerai-app
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-refrigerai}:${POSTGRES_PASSWORD:-refrigerai123!}@db:5432/${POSTGRES_DB:-refrigerai}?schema=public
      
      # API Keys (from .env.production)
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_VISION_API_KEY: ${GOOGLE_VISION_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      
      # Next.js
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: refrigerai-network
